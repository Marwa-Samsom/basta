name: basta

# خدمات التطوير المحلية.
#
# كل منفذ مربوط بـ 127.0.0.1: كانت على 0.0.0.0 فيصل إليها كل من على الشبكة نفسها
# (مقهى، مكتب، شبكة مشتركة) — قاعدة البيانات بكلمة مرور مكتوبة في هذا الملف، و Redis
# بلا كلمة مرور، ولوحة MinIO بـ minioadmin. وكلمات المرور من .env لا من هنا: غيابها
# يوقف `docker compose up` برسالته بدل أن تعمل الخدمة بكلمة يعرفها كل من قرأ المستودع.
# القيم في .env.example (ولّد قيمك: openssl rand -base64 24).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: basta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?اضبط POSTGRES_PASSWORD في .env}
      POSTGRES_DB: basta
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basta -d basta"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?اضبط REDIS_PASSWORD في .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?اضبط REDIS_PASSWORD في .env}
    ports: ["127.0.0.1:6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?اضبط MEILI_MASTER_KEY في .env}
      MEILI_ENV: development
    ports: ["127.0.0.1:7700:7700"]
    volumes:
      - meilidata:/meili_data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-basta}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?اضبط MINIO_ROOT_PASSWORD في .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
